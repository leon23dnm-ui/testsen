[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iski"
version = "0.1.0"
description = "ISKI M0 v3.0 prototype skeleton"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
# Внешний плагин libtmux (установлен в окружении, не является зависимостью проекта)
# несовместим с pytest>=9: его conftest-хук применяет marks к фикстурам, что приводит
# к ошибке сбора "Marks cannot be applied to fixtures". Отключаем его автозагрузку.
addopts = "-p no:libtmux"

[tool.setuptools.packages.find]
where = ["src"]
