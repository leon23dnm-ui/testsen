<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISKI Chat — арифметика</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;font-weight:600}header .badge{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:2px 8px}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;padding:10px 14px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.meta{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.hints{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 8px}
.hints button{background:var(--panel);border:1px solid var(--border);color:var(--accent);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:13px}
.hints button:hover{border-color:var(--accent)}
footer{display:flex;gap:10px;padding:14px 20px;background:var(--panel);border-top:1px solid var(--border)}
#inp{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
#inp:focus{border-color:var(--accent)}
#send{background:var(--accent);border:none;color:#0d1117;font-weight:600;border-radius:10px;padding:12px 22px;cursor:pointer}
#send:disabled{opacity:.5;cursor:wait}
.typing{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header><h1>🤖 ISKI Chat — цифры и + − × ÷</h1><span class="badge" id="status">подключение…</span></header>
<div id="chat"><div class="msg bot">Привет! Я обучена на цифрах и операциях + − × ÷. Спроси, например: «1+1», «сколько будет 45 - 5?» или «9 разделить на 3».</div></div>
<div class="hints">
<button>1+1</button><button>45-5</button><button>9/3</button><button>7*8</button><button>12÷4</button><button>100 минус 1</button>
</div>
<footer><input id="inp" placeholder="Например: сколько будет 12 * 8?" autocomplete="off"><button id="send">➤</button></footer>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),send=document.getElementById('send'),status=document.getElementById('status');
function bubble(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function check(){try{const r=await fetch('/api/health');const j=await r.json();status.textContent=j.model_loaded?('модель загружена · acc '+(j.holdout_acc*100).toFixed(1)+'%'):'только эталонный калькулятор';status.style.color=j.model_loaded?'var(--ok)':'var(--warn)'}catch(e){status.textContent='сервер недоступен'}}
async function ask(){const q=inp.value.trim();if(!q)return;inp.value='';send.disabled=true;bubble('user',q.replace(/</g,'&lt;'));const t=bubble('bot','<span class="typing">думаю…</span>');
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});const j=await r.json();t.innerHTML=j.reply.replace(/</g,'&lt;')+'<span class="meta">'+(j.source||'')+' · '+Math.round(j.ms||0)+' мс</span>'}
catch(e){t.innerHTML='⚠️ ошибка соединения с сервером'}
send.disabled=false;inp.focus();chat.scrollTop=chat.scrollHeight}
send.onclick=ask;inp.onkeydown=e=>{if(e.key==='Enter')ask()};document.querySelectorAll('.hints button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;ask()});check();
</script>
</body>
</html>
